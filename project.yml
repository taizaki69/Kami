name: Kami
options:
  bundleIdPrefix: app.kami
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MihonCompatKit:
    path: Packages/MihonCompatKit
  KamiCore:
    path: Packages/KamiCore

targets:
  Kami:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: MihonCompatKit
      - package: KamiCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kami
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kami.reader
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false


schemes:
  Kami:
    build:
      targets:
        Kami: all
    run:
      config: Debug
    test:
      config: Debug
