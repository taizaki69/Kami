name: iOS Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -project Kami.xcodeproj -scheme Kami -resolvePackageDependencies

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Kami.xcodeproj -scheme Kami \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | xcbeautify

      - name: Run reader rendering tests on iOS Simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [d["udid"] for runtime, group in sorted(devices.items(), reverse=True)
                     if ".iOS-" in runtime for d in group
                     if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not matches:
              raise SystemExit("No available iPhone simulator")
          print(matches[0])')
          xcodebuild -project Kami.xcodeproj -scheme Kami \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath ReaderRendering.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:KamiTests/ReaderTiledImageTests \
            test 2>&1 | xcbeautify

      - name: Upload reader rendering results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-rendering-results
          path: ReaderRendering.xcresult
          if-no-files-found: ignore

  device:
    name: Generic iOS device build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for generic iOS device
        run: |
          set -o pipefail
          xcodebuild -project Kami.xcodeproj -scheme Kami \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcbeautify
