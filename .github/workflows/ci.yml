name: Swift CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portable Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Fetch pinned extension corpus
        run: bash ./scripts/fetch_corpus.sh

      - name: MihonCompatKit tests
        run: swift test --package-path Packages/MihonCompatKit

      - name: Build compat-audit (release)
        run: swift build --package-path Packages/MihonCompatKit -c release --product compat-audit

      - name: KamiCore tests
        run: swift test --package-path Packages/KamiCore

      - name: Upload compat-audit binary
        uses: actions/upload-artifact@v4
        with:
          name: compat-audit-macos
          path: Packages/MihonCompatKit/.build/release/compat-audit
          if-no-files-found: error

  linux:
    name: Linux Swift 6.3.3 & SQLite tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Swift runtime dependencies and SQLite headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libz3-dev libsqlite3-dev

      - name: Install checksum-pinned Swift 6.3.3
        shell: bash
        run: |
          swift_archive="$RUNNER_TEMP/kami-swift-6.3.3.tar.gz"
          swift_toolchain="$RUNNER_TEMP/kami-swift-6.3.3"
          curl --fail --location --retry 3 \
            https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz \
            --output "$swift_archive"
          printf '%s  %s\n' \
            da8272a5fddccd65b1529ed0e52e04526e2eadd4237d58d6220efeb973c6cd19 \
            "$swift_archive" | sha256sum --check --strict
          mkdir -p "$swift_toolchain"
          tar -xzf "$swift_archive" -C "$swift_toolchain" --strip-components=1
          printf '%s\n' "$swift_toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Print toolchain
        run: swift --version

      - name: Verify pinned extension corpus
        run: bash ./scripts/fetch_corpus.sh

      - name: MihonCompatKit tests
        run: swift test --package-path Packages/MihonCompatKit --jobs 6

      - name: KamiCore tests with SQLite enabled
        shell: bash
        run: |
          sqlite_module="$RUNNER_TEMP/kami-sqlite3"
          mkdir -p "$sqlite_module"
          cat > "$sqlite_module/module.modulemap" <<'MODULE'
          module SQLite3 [system] {
              header "/usr/include/sqlite3.h"
              link "sqlite3"
              export *
          }
          MODULE
          swift -I "$sqlite_module" -e 'import SQLite3; precondition(sqlite3_libversion_number() > 0)'
          swift test --package-path Packages/KamiCore --jobs 6 \
            -Xswiftc -I -Xswiftc "$sqlite_module" \
            -Xlinker -lsqlite3

      - name: Build compat-audit and audit locked measurement role
        run: |
          swift build --package-path Packages/MihonCompatKit --jobs 6 -c release --product compat-audit
          Packages/MihonCompatKit/.build/release/compat-audit gaps Tests/corpus --role measurement
