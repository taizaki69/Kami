name: IPA Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned IPA artifact
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release .app for device (unsigned)
        run: |
          xcodebuild -project Kami.xcodeproj -scheme Kami \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="derived/Build/Products/Release-iphoneos/Kami.app"
          test -d "$APP" || { echo "Kami.app not produced"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Kami-unsigned.ipa Payload
          echo "KAMI_IPA=Kami-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kami-unsigned-ipa
          path: Kami-unsigned.ipa
          if-no-files-found: error

      - name: Explain signing status
        run: |
          echo "This IPA is UNSIGNED. Install via a sideloading tool that signs"
          echo "at install time (AltStore/Sideloadly/SideStore/TrollStore)."
          echo "Signed builds require user-owned credentials; see docs/IPA_BUILD.md."
